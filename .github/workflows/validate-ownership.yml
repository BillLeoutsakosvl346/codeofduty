name: Validate ownership declaration

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > "$RUNNER_TEMP/changed-files.txt"
      - name: Validate declared contributors and feature paths
        run: npx tsx scripts/ownership/validate-pr.ts --changed-files "$RUNNER_TEMP/changed-files.txt"
